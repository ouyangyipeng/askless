[project]
name = "askless"
version = "0.2.0"
description = "Run the alternatives. Ask only what matters."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11",
    "isort>=6",
    "ty>=0.0.1",
    "httpx2>=2.16.0",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.isort]
profile = "black"
line_length = 160

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askless"]
